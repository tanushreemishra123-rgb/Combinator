# Netlify: connect the repo and this file configures everything.
# Manual alternative: `npm run build` then drag the dist/ folder onto Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app is state-driven with no client-side router, but this keeps any stray
# deep link landing on the app instead of a 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # 'unsafe-inline' for styles only: React style attributes (progress bars,
    # confetti) are style attributes, not scripts. Scripts stay 'self'.
    # api.anthropic.com is needed only by the opt-in live AI provider.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
