services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-learning-adventure-api
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - API_CORS_ORIGIN=*
      - API_DB_FILE=/app/apps/api/data/learner.db
      - API_MISSION_DATA_DIR=/app/apps/api/mission-data
    volumes:
      - api-data:/app/apps/api/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  learner-ui:
    build:
      context: .
      dockerfile: apps/learner-ui/Dockerfile
    container_name: ai-learning-adventure-learner-ui
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
      args:
        - UPSTREAM_ORIGIN=http://api:4000
        - NEXT_PUBLIC_LEARNER_URL=http://localhost:5173
    container_name: ai-learning-adventure-admin-ui
    ports:
      - '127.0.0.1:6173:6173'
    environment:
      - NODE_ENV=production
      - PORT=6173
      - HOSTNAME=0.0.0.0
      - UPSTREAM_API_ORIGIN=http://api:4000
      - NEXT_PUBLIC_LEARNER_URL=http://localhost:5173
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
    driver: local
