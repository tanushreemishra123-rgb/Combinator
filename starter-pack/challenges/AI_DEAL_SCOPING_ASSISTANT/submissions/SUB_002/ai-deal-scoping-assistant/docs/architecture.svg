<line x1="320" y1="212" x2="320" y2="240" stroke="none"/>
<text x="30" y="812" font-size="11.5" fill="#42506b">Solid arrows: data flow through the shared, reviewed scope model. Dashed arrow: optional live AI call (falls back to the mock provider with a visible notice).</text>
<text x="30" y="830" font-size="11.5" fill="#42506b">Every generated section records provider, mode, fallback flag and validation issues; every number in the estimate comes from the deterministic engine and visible configuration.</text>
