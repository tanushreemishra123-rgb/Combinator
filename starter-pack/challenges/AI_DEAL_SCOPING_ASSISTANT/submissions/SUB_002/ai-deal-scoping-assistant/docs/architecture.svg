<text x="115.0" y="291" text-anchor="middle" font-size="11" fill="#42506b">layer (src/ingestion)</text>
<text x="115.0" y="306" text-anchor="middle" font-size="11" fill="#42506b">text, Markdown, DOCX, PDF</text>
<text x="115.0" y="321" text-anchor="middle" font-size="11" fill="#42506b">normalise, sections, line numbers</text>
<rect x="225" y="250" width="170" height="96" rx="10" fill="#e6f7f1" stroke="#1a8f6a" stroke-width="1.5"/>
