<text x="770.0" y="601" text-anchor="middle" font-size="11" fill="#42506b">(src/quality)</text>
<text x="770.0" y="616" text-anchor="middle" font-size="11" fill="#42506b">12 deterministic pre-export checks,</text>
<text x="770.0" y="631" text-anchor="middle" font-size="11" fill="#42506b">export status Ready / Review Required / Blocked</text>
