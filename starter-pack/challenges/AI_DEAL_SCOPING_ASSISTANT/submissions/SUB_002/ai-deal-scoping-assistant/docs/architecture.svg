<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">AI Deal Scoping Assistant - submission architecture</title>
<desc id="d">Browser application, requirements-ingestion layer, AI orchestration layer with mock and optional live provider, structured scope model, PRD and scope generator, cloud-architecture generator, data and integration strategy generator, AI solution generator, estimation component, traceability, change-impact and quality-validation components, and the export layer.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b8c"/></marker></defs>
