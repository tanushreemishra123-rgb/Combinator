<text x="1080.0" y="481" text-anchor="middle" font-size="11" fill="#42506b">Gemini | Groq | OpenRouter - single fetch site</text>
<text x="1080.0" y="496" text-anchor="middle" font-size="11" fill="#42506b">key kept in sessionStorage only</text>
