<text x="1070.0" y="616" text-anchor="middle" font-size="11" fill="#42506b">package model -&gt; Markdown, HTML (print to PDF),</text>
<text x="1070.0" y="631" text-anchor="middle" font-size="11" fill="#42506b">DOCX, workspace JSON; mandatory disclaimer</text>
