<text x="620.0" y="72" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b3d">Browser application (React + TypeScript single-page app)</text>
<text x="620.0" y="91" text-anchor="middle" font-size="11" fill="#42506b">Customer Requirements Workspace | PRD and Scope Workspace | Architecture Workspace | Data, Integration, and AI Workspace | Estimate Workspace | Final Scoping Package</text>
<text x="620.0" y="106" text-anchor="middle" font-size="11" fill="#42506b">src/ui, src/app - design system, SVG diagram renderer, clearly labelled Mock / Live AI mode badge</text>
<rect x="30" y="150" width="1180" height="62" rx="10" fill="#f3f5f9" stroke="#8492ad" stroke-width="1.5"/>
<text x="620.0" y="172" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b3d">Application state layer (src/state)</text>
<text x="620.0" y="191" text-anchor="middle" font-size="11" fill="#42506b">session store and use cases: analyse, review, approve, generate, change flow, regenerate affected only, quality gate, export | schema-validated local persistence</text>
