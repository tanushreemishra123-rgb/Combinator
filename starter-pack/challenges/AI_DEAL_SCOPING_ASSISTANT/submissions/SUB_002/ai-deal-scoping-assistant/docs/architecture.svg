<text x="310.0" y="291" text-anchor="middle" font-size="11" fill="#42506b">(src/analysis)</text>
<text x="310.0" y="306" text-anchor="middle" font-size="11" fill="#42506b">extract, classify, gaps,</text>
<text x="310.0" y="321" text-anchor="middle" font-size="11" fill="#42506b">ground quotes to source lines</text>
<rect x="420" y="250" width="185" height="96" rx="10" fill="#dff3ff" stroke="#0b74c4" stroke-width="1.5"/>
