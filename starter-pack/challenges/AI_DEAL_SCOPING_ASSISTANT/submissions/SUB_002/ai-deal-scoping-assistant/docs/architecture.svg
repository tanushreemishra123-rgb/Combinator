<text x="1080.0" y="277" text-anchor="middle" font-size="11" fill="#42506b">prompt kit, task definitions,</text>
<text x="1080.0" y="292" text-anchor="middle" font-size="11" fill="#42506b">provider call, JSON extraction,</text>
<text x="1080.0" y="307" text-anchor="middle" font-size="11" fill="#42506b">Zod schema validation, one repair retry,</text>
<text x="1080.0" y="322" text-anchor="middle" font-size="11" fill="#42506b">labelled fallback, generation metadata</text>
<rect x="950" y="366" width="260" height="58" rx="10" fill="#f1ecff" stroke="#6a4bd1" stroke-width="1.5"/>
