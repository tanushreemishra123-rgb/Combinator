<text x="1080.0" y="407" text-anchor="middle" font-size="11" fill="#42506b">heuristic engine + recorded seed responses</text>
<text x="1080.0" y="422" text-anchor="middle" font-size="11" fill="#42506b">same validation path as live output</text>
<rect x="950" y="440" width="260" height="58" rx="10" fill="#ffffff" stroke="#6a4bd1" stroke-width="1.5"/>
