# Backend lint configuration. Run: .venv/bin/ruff check app tests
target-version = "py311"
line-length = 100

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # modern Python idioms
    "B",               # bugbear
    "BLE",             # no silent blind excepts (justified ones carry a noqa)
    "SIM",             # simplifications
    "RUF",             # ruff's own checks
]
ignore = [
    # Pydantic model fields are deep-copied per instance; ClassVar would be wrong.
    "RUF012",
]

[lint.per-file-ignores]
# Pytest fixtures are imported from helper modules and then intentionally
# shadowed by test function parameters of the same name.
"tests/*" = ["F811"]
