services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      # Optional. Copy backend/.env.example to backend/.env and add a key for
      # live AI. Without the file the app runs in deterministic mock mode.
      - path: ./backend/.env
        required: false
    ports:
      # nosemgrep: trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces -- local dev stack; the container must listen on all interfaces for Compose to reach it, and the published port is the intended boundary
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build: ./frontend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    ports:
      # nosemgrep: trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces -- local dev stack; the container must listen on all interfaces for Compose to reach it, and the published port is the intended boundary
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
