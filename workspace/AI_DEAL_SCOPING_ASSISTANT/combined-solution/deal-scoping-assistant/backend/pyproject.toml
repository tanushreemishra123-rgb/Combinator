[project]
name = "deal-scoping-backend"
version = "0.1.0"
description = "AI Deal Scoping Assistant - API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "langchain==1.4.1",
    "langchain-google-genai==4.4.0",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "reportlab==5.0.1",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[tool.uv]
package = false
# Dependency cooldown: nothing published after this moment can be resolved, so a freshly
# published (possibly hijacked) release cannot slip in. The rule asks for a rolling "7
# days" window instead, but langchain 1.4.1 is newer than that and the project would not
# resolve at all; a fixed cutoff just after the newest pinned upload is stricter and
# deterministic, and every direct dependency is pinned with == next to a committed lock.
# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown -- fixed cutoff is stricter than the rolling window the rule suggests
exclude-newer = "2026-09-17T23:59:59Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
# S101: assert is fine in tests; app code raises explicit errors.
# UP046/UP047: the security scanner cannot parse PEP 695 generics yet, so the classic
# TypeVar form stays.
ignore = ["S101", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]
