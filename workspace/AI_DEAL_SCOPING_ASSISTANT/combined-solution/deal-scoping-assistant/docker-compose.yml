# Runs the whole app locally: http://localhost:8080 (UI) and http://localhost:8000 (API).
# Mock AI mode is the default. For live AI, copy backend/.env.example to backend/.env first.
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DATABASE_URL: sqlite:////app/data/app.db
    ports:
      - "127.0.0.1:8000:8000"   # local only; not exposed on the network
    volumes:
      - backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # local only; not exposed on the network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  backend-data:
